# Published vectors and explicitly labeled local cryptographic fixtures.
# They never authenticate real accounts. Each entry names exact files, never a directory.
[extend]
useDefault = true

# RFC 9421 Appendix B.1 published example keys.
[[allowlists]]
description = "RFC 9421 Appendix B.1 published example keys"
paths = [
  '''^test/fixtures/crypto/(rsa|rsa_pss|p256|ed25519)_private\.pem$''',
]

[[allowlists]]
description = "RFC 8410 Section 10.3 published OneAsymmetricKey example"
paths = [
  '''^test/fixtures/crypto/rfc8410_10_3_oneasymmetrickey\.pem$''',
]

# The same RFC 8410 Section 10.3 example appeared inline in one test before it
# moved to the fixture above. Both conditions must match: that commit and file.
[[allowlists]]
description = "RFC 8410 Section 10.3 example inline in one earlier test commit"
condition = "AND"
commits = ["175cd2ab75569267d3c2c8319661c35a06947d79"]
paths = [
  '''^test/custody_local_test\.exs$''',
]

# RFC 7520 cookbook files (ietf-jose/cookbook at 13692b68), two Wycheproof files
# (C2SP/wycheproof at 12fd3aaf), and examples extracted from RFC 7515 and RFC 7516.
[[allowlists]]
description = "RFC 7520 cookbook, Wycheproof and RFC 7515/7516 JOSE vectors"
paths = [
  '''^test/fixtures/jose/4_1\.rsa_v15_signature\.json$''',
  '''^test/fixtures/jose/4_2\.rsa-pss_signature\.json$''',
  '''^test/fixtures/jose/4_3\.ecdsa_signature\.json$''',
  '''^test/fixtures/jose/4_4\.hmac-sha2_integrity_protection\.json$''',
  '''^test/fixtures/jose/4_5\.signature_with_detached_content\.json$''',
  '''^test/fixtures/jose/4_6\.protecting_specific_header_fields\.json$''',
  '''^test/fixtures/jose/4_7\.protecting_content_only\.json$''',
  '''^test/fixtures/jose/4_8\.multiple_signatures\.json$''',
  '''^test/fixtures/jose/5_1\.key_encryption_using_rsa_v15_and_aes-hmac-sha2\.json$''',
  '''^test/fixtures/jose/5_10\.including_additional_authentication_data\.json$''',
  '''^test/fixtures/jose/5_11\.protecting_specific_header_fields\.json$''',
  '''^test/fixtures/jose/5_12\.protecting_content_only\.json$''',
  '''^test/fixtures/jose/5_13\.encrypting_to_multiple_recipients\.json$''',
  '''^test/fixtures/jose/5_2\.key_encryption_using_rsa-oaep_with_aes-gcm\.json$''',
  '''^test/fixtures/jose/5_3\.key_wrap_using_pbes2-aes-keywrap_with-aes-cbc-hmac-sha2\.json$''',
  '''^test/fixtures/jose/5_4\.key_agreement_with_key_wrapping_using_ecdh-es_and_aes-keywrap_with_aes-gcm\.json$''',
  '''^test/fixtures/jose/5_5\.key_agreement_using_ecdh-es_with_aes-cbc-hmac-sha2\.json$''',
  '''^test/fixtures/jose/5_6\.direct_encryption_using_aes-gcm\.json$''',
  '''^test/fixtures/jose/5_7\.key_wrap_using_aes-gcm_keywrap_with_aes-cbc-hmac-sha2\.json$''',
  '''^test/fixtures/jose/5_8\.key_wrap_using_aes-keywrap_with_aes-gcm\.json$''',
  '''^test/fixtures/jose/5_9\.compressed_content\.json$''',
  '''^test/fixtures/jose/6\.nesting_signatures_and_encryption\.json$''',
  '''^test/fixtures/jose/aes_gcm_test\.json$''',
  '''^test/fixtures/jose/rfc7515\.json$''',
  '''^test/fixtures/jose/rfc7516\.json$''',
  '''^test/fixtures/jose/rsa_oaep_2048_sha256_mgf1sha256_test\.json$''',
]

# Conformance corpus copies of published sources: RFC 3394, RFC 7515, the RFC 7520
# cookbook (ietf-jose/cookbook at 13692b68), RFC 9421 Appendix B.1 example keys and
# Wycheproof (C2SP/wycheproof at 12fd3aaf). corpus/sources/*/PROVENANCE.md names each.
[[allowlists]]
description = "Conformance corpus copies of published JOSE, RFC 3394, RFC 9421 and Wycheproof vectors"
paths = [
  '''^corpus/sources/rfc3394/rfc3394\.txt$''',
  '''^corpus/sources/rfc7515/rfc7515\.json$''',
  '''^corpus/sources/rfc7520/5_3\.key_wrap_using_pbes2-aes-keywrap_with-aes-cbc-hmac-sha2\.json$''',
  '''^corpus/sources/rfc7520/5_4\.key_agreement_with_key_wrapping_using_ecdh-es_and_aes-keywrap_with_aes-gcm\.json$''',
  '''^corpus/sources/rfc7520/5_7\.key_wrap_using_aes-gcm_keywrap_with_aes-cbc-hmac-sha2\.json$''',
  '''^corpus/sources/rfc7520/5_8\.key_wrap_using_aes-keywrap_with_aes-gcm\.json$''',
  '''^corpus/sources/rfc7520/5_9\.compressed_content\.json$''',
  '''^corpus/sources/rfc7520/5_10\.including_additional_authentication_data\.json$''',
  '''^corpus/sources/rfc7520/5_11\.protecting_specific_header_fields\.json$''',
  '''^corpus/sources/rfc7520/5_12\.protecting_content_only\.json$''',
  '''^corpus/sources/rfc7520/5_13\.encrypting_to_multiple_recipients\.json$''',
  '''^corpus/sources/rfc7520/6\.nesting_signatures_and_encryption\.json$''',
  '''^corpus/sources/rfc9421/keys/ed25519_private\.pem$''',
  '''^corpus/sources/rfc9421/keys/p256_private\.pem$''',
  '''^corpus/sources/rfc9421/keys/rsa_private\.pem$''',
  '''^corpus/sources/rfc9421/keys/rsa_pss_private\.pem$''',
  '''^corpus/sources/wycheproof/aes_gcm_test\.json$''',
  '''^corpus/sources/wycheproof/aes_wrap_test\.json$''',
  '''^corpus/sources/wycheproof/rsa_oaep_2048_sha256_mgf1sha256_test\.json$''',
]

