name: Proofs
# Every proof in the repository's contract, defined once. ci.yml calls it for each kci/<sha>
# candidate and joins it in `qualified`; contributions.yml calls it for outside pull requests.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  process-ownership-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s test -p processes_test.py
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      node: ${{ steps.pins.outputs.node }}
      elixir: ${{ steps.pins.outputs.elixir }}
      otp: ${{ steps.pins.outputs.otp }}
      postgres_image: ${{ steps.pins.outputs.postgres_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        run: python3 scripts/toolchain.py --github-output "$GITHUB_OUTPUT"
  verify:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.matrix) }}
    services:
      postgres:
        image: ${{ needs.toolchain.outputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ needs.toolchain.outputs.node }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # The declared gate runs dialyzer; its PLT is worth caching on the lane
      # that runs the gate (floor/mid lanes do not analyze).
      - if: matrix.lane == 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: dialyzer-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-plt-${{ matrix.elixir }}-${{ matrix.otp }}-
      - if: matrix.lane == 'floor'
        run: mix test --warnings-as-errors
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - if: matrix.lane == 'mid'
        run: mix test --warnings-as-errors
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - if: matrix.lane == 'floor'
        run: python3 scripts/check_optional_clients.py
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      # The latest gate also invokes check_optional_clients.py, including the
      # ash_onetime and ash_hooks floors available on that toolchain.
      - if: matrix.lane == 'latest'
        run: python3 scripts/check.py
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
  mutations:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Require every reversing mutation to turn its named test red
        run: python3 scripts/mutations.py
  teardown:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Measure near-cap teardown against the library bounds
        run: python3 scripts/jwe_teardown_gate.py --output "$RUNNER_TEMP/jwe-teardown.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jwe-teardown
          if-no-files-found: error
          path: ${{ runner.temp }}/jwe-teardown.json
