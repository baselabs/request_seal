name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pins
        run: python3 scripts/toolchain.py --github-output "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.pins.outputs.elixir }}
          otp-version: ${{ steps.pins.outputs.otp }}
          version-type: strict
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify release identity
        id: identity
        run: python3 scripts/release.py --verify --notes-file release-notes.md
      - name: Verify dependencies and corpus pin
        env:
          MIX_ENV: test
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix hex.audit
          mix test test/corpus_test.exs --warnings-as-errors
      - name: Verify corpus and create deterministic assets
        run: |
          metadata=$(find corpus -name .DS_Store -print)
          if [ -n "$metadata" ]; then
            echo "Refusing to package corpus containing .DS_Store" >&2
            exit 1
          fi
          python3 scripts/verify_corpus.py
          umask 022
          tar -C corpus --format=gnu --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' --exclude=.DS_Store -cf - index.json sources cases | gzip -n > corpus.tar.gz
          sha256sum corpus.tar.gz > corpus.sha256
      - name: Require byte-identical published Hex package
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          MIX_ENV: prod
        run: |
          mix deps.get --check-locked
          mix hex.build
          published=$(mktemp -d)
          trap 'rm -rf "$published"' EXIT
          mix hex.package fetch request_seal "$VERSION" --output "$published"
          cmp "request_seal-$VERSION.tar" "$published/request_seal-$VERSION.tar"
          sha256sum "request_seal-$VERSION.tar" "$published/request_seal-$VERSION.tar"
      - name: Generate and verify package dependency SBOM
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          MIX_ENV: prod
        run: python3 scripts/sbom.py --tarball "request_seal-$VERSION.tar" --output sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            request_seal-${{ steps.identity.outputs.version }}.tar
            corpus.tar.gz
            corpus.sha256
            sbom.cdx.json
            release-notes.md
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - name: Detect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          if gh api --include "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > "$response"; then
            {
              echo 'exists=true'
              echo 'names<<RELEASE_ASSET_NAMES'
              sed '1,/^\r\{0,1\}$/d' "$response" | jq -r '.assets[].name'
              echo 'RELEASE_ASSET_NAMES'
            } >> "$GITHUB_OUTPUT"
          else
            status=$(awk '/^HTTP\// { code=$2 } END { print code }' "$response")
            if [ "$status" = 404 ]; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
            else
              echo "Cannot determine existing release (HTTP ${status:-unavailable})" >&2
              exit 1
            fi
          fi
      - name: Compare existing release assets before attestation
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          NAMES: ${{ steps.existing.outputs.names }}
        run: |
          existing=$(mktemp -d)
          trap 'rm -rf "$existing"' EXIT
          for asset in "request_seal-$VERSION.tar" corpus.tar.gz corpus.sha256 sbom.cdx.json; do
            if grep -Fxq "$asset" <<< "$NAMES"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$existing"
              cmp "$asset" "$existing/$asset" || { echo "Existing asset differs: $asset" >&2; exit 1; }
              sha256sum "$asset" "$existing/$asset"
            fi
          done
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            request_seal-${{ needs.verify.outputs.version }}.tar
            corpus.tar.gz
            sbom.cdx.json
      - name: Attest the package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: request_seal-${{ needs.verify.outputs.version }}.tar
          sbom-path: sbom.cdx.json
      - name: Publish assets on the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          NAMES: ${{ steps.existing.outputs.names }}
        run: |
          assets=("request_seal-$VERSION.tar" corpus.tar.gz corpus.sha256 sbom.cdx.json)
          if [ "$EXISTS" = true ]; then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq "$asset" <<< "$NAMES"; then
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "RequestSeal $VERSION" --notes-file release-notes.md "${flags[@]}" "${assets[@]}"
          fi
