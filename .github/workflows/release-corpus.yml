name: Release conformance corpus
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
          version-type: strict
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify release identity and corpus pin
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          tag = os.environ['GITHUB_REF_NAME']
          index = json.loads(pathlib.Path('corpus/index.json').read_text())
          version = re.search(r'version: "([^"]+)"', pathlib.Path('mix.exs').read_text()).group(1)
          if index['elixir_release'] != tag or 'v' + version != tag:
              raise SystemExit('release tag, corpus release, and package version must match')
          PY
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix test test/corpus_test.exs --warnings-as-errors
      - name: Verify corpus and create deterministic assets
        run: |
          metadata=$(find corpus -name .DS_Store -print)
          if [ -n "$metadata" ]; then
            echo "Refusing to package corpus containing .DS_Store" >&2
            exit 1
          fi
          python3 scripts/verify_corpus.py
          umask 022
          tar -C corpus --format=gnu --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' --exclude=.DS_Store -cf - index.json sources cases | gzip -n > corpus.tar.gz
          sha256sum corpus.tar.gz > corpus.sha256
      - name: Publish assets on the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir existing-assets
            names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            for asset in corpus.tar.gz corpus.sha256; do
              if grep -Fxq "$asset" <<< "$names"; then
                gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir existing-assets
                cmp "$asset" "existing-assets/$asset" || { echo "Existing asset differs: $asset" >&2; exit 1; }
                sha256sum "$asset" "existing-assets/$asset"
              fi
            done
            for asset in corpus.tar.gz corpus.sha256; do
              if ! grep -Fxq "$asset" <<< "$names"; then
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag corpus.tar.gz corpus.sha256
          fi
