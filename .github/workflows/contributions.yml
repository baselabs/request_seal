name: Contributions
# Outside pull requests run the same proofs under other check names, with no secrets.
# This run is not the verdict: a change reaches main only as a kci/<sha> candidate.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contribution:
    uses: ./.github/workflows/proofs.yml
