name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: floor
            elixir: '1.18.4'
            otp: '27.3.4'
          - lane: mid
            elixir: '1.19.5'
            otp: '28.5.0.7'
          - lane: latest
            elixir: '1.20.4'
            otp: '29.1.1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # The declared gate runs dialyzer; its PLT is worth caching on the lane
      # that runs the gate (floor/mid lanes do not analyze).
      - if: matrix.lane == 'latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: dialyzer-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-plt-${{ matrix.elixir }}-${{ matrix.otp }}-
      - if: matrix.lane == 'floor'
        run: mix test --warnings-as-errors
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - if: matrix.lane == 'mid'
        run: mix test --warnings-as-errors
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - if: matrix.lane == 'floor'
        run: python3 scripts/check_optional_clients.py
      # The Elixir 1.20 lane includes ash_onetime and ash_hooks integration tests.
      - if: matrix.lane == 'latest'
        run: python3 scripts/check.py
        env:
          REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
