name: CI
# One qualification run per kci/<sha> candidate; `qualified` is its verdict, and only a
# candidate with a successful verdict moves main.
on:
  push:
    branches: ['kci/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    uses: ./.github/workflows/proofs.yml
  qualified:
    name: qualified
    if: always()
    needs: [proofs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every proof job in this run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          PROOFS_RESULT: ${{ needs.proofs.result }}
        run: python3 scripts/qualify.py
