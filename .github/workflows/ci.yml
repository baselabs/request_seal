name: CI
# One qualification run per kci/<sha> candidate; `qualified` is its verdict, and only a
# candidate with a successful verdict moves main.
on:
  push:
    branches: ['kci/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    uses: ./.github/workflows/proofs.yml
  qualified:
    name: qualified
    if: always()
    needs: [proofs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["NEEDS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if not results or failed:
              print("Qualification refused: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
