name: CI
# One qualification run per kci/<sha> candidate; `qualified` is its verdict, and only a
# candidate with a successful verdict moves main.
on:
  push:
    branches: ['kci/**']
defaults:
  run:
    shell: bash

# Throwaway fixture values, never credentials for an external service.
env:
  TEST_PG_USER: postgres
  TEST_PG_PASSWORD: postgres
  TEST_PG_DATABASE: requestseal_test
  TEST_PG_PORT: 18841

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  process-ownership-macos:
    needs: toolchain
    runs-on: macos-15
    timeout-minutes: 5 # run 44281082286: cold 1m11s (<2.5m)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - run: python3 -B -m unittest discover -s test -p processes_test.py
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44170631454: cold 10s (<2.5m)
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      nodejs: ${{ steps.pins.outputs.nodejs }}
      python: ${{ steps.pins.outputs.python }}
      elixir: ${{ steps.pins.outputs.elixir }}
      otp: ${{ steps.pins.outputs.otp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: Test the shared toolchain reader
        run: scripts/toolchain.sh --self-test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ steps.pins.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - id: matrix
        env:
          TOOLCHAIN_OUTPUTS: ${{ toJSON(steps.pins.outputs) }}
        run: python3 scripts/qualify.py --matrix >> "$GITHUB_OUTPUT"
  verify:
    name: verify (${{ matrix.lane }})
    needs: toolchain
    runs-on: ubuntu-24.04
    # floor: run 44281082286 cold 14m02s (slower than 44295770186's 11m52s).
    # mid/latest: run 44295770186 cold 11m02s/25m27s; latest's PLT restore missed.
    timeout-minutes: ${{ matrix.lane == 'latest' && 51 || matrix.lane == 'floor' && 29 || 23 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.matrix) }}
    env:
      REQUESTSEAL_TEST_PG_SERVER: rs-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      # Job env cannot read the env context; the URL repeats the workflow's fixture values.
      REQUESTSEAL_REPLAY_PG_URL: postgres://postgres:postgres@127.0.0.1:18841/requestseal_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.toolchain.outputs.nodejs }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Refuse a differing installed runtime
        env:
          ELIXIR: ${{ matrix.elixir }}
          OTP: ${{ matrix.otp }}
          NODEJS: ${{ needs.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "elixir=$ELIXIR" "erlang=$OTP" "nodejs=$NODEJS"
      - name: Restore Mix test dependencies and build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: mix-${{ matrix.lane }}-${{ matrix.elixir }}-${{ matrix.otp }}-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
      - name: Restore Mix dev dependencies and build
        if: matrix.lane != 'mid'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
          key: mix-${{ matrix.lane }}-${{ matrix.elixir }}-${{ matrix.otp }}-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
      - name: Restore Mix prod dependencies and build
        if: matrix.lane == 'latest'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/prod
          key: mix-${{ matrix.lane }}-${{ matrix.elixir }}-${{ matrix.otp }}-prod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
      - name: Restore Dialyzer PLT
        if: matrix.lane == 'latest'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: dialyzer-plt-mix-${{ matrix.lane }}-${{ matrix.elixir }}-${{ matrix.otp }}-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Check the public platform engine and pull its digest
        shell: bash
        run: |
          engine="$(cat .github/postgres.ref)"
          [[ "$engine" =~ ^ghcr\.io/baselabs/postgres:[0-9]+\.[0-9]+-inputs-[0-9a-f]{64}@sha256:[0-9a-f]{64}$ ]]
          current_digest="$(python3 - <<'PY'
          import json, re, time, urllib.error, urllib.request
          host, path = 'ghcr.io', 'baselabs/postgres'
          def read(request, answer):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return answer(response)
                  except urllib.error.HTTPError as error:
                      if (error.code != 429 and error.code < 500) or attempt == 2:
                          raise
                  except OSError:
                      if attempt == 2:
                          raise
                  time.sleep(10 * (attempt + 1))
          token = read(f'https://{host}/token?scope=repository:{path}:pull', lambda response: json.load(response)['token'])
          request = urllib.request.Request(f'https://{host}/v2/{path}/manifests/current', method='HEAD', headers={
              'Authorization': 'Bearer ' + token,
              'Accept': ', '.join(('application/vnd.oci.image.index.v1+json', 'application/vnd.oci.image.manifest.v1+json',
                                   'application/vnd.docker.distribution.manifest.list.v2+json',
                                   'application/vnd.docker.distribution.manifest.v2+json'))})
          digest = read(request, lambda response: response.headers.get('Docker-Content-Digest', ''))
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('ghcr.io/baselabs/postgres:current: registry named no digest')
          print(digest)
          PY
          )"
          if [ "${engine##*@}" != "$current_digest" ]; then
            echo 'checked PostgreSQL digest differs from ghcr.io/baselabs/postgres:current' >&2; exit 1
          fi
          docker pull "$engine"
      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          engine="$(cat .github/postgres.ref)"
          docker run --detach --pull=never --name "$REQUESTSEAL_TEST_PG_SERVER" \
            --publish "127.0.0.1:$TEST_PG_PORT:5432" \
            --tmpfs /var/lib/pg:uid=26,gid=26,mode=0750 --tmpfs /tmp \
            --env TEST_PG_USER --env TEST_PG_PASSWORD --env TEST_PG_DATABASE \
            --entrypoint baselabs-test-postgres "$engine"
          ready=false
          for ((attempt=0; attempt<60; attempt++)); do
            if docker exec "$REQUESTSEAL_TEST_PG_SERVER" pg_isready -h 127.0.0.1 -U "$TEST_PG_USER" -d "$TEST_PG_DATABASE"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$REQUESTSEAL_TEST_PG_SERVER"
            echo "::error::PostgreSQL did not become ready within 60 attempts"
            exit 1
          fi
      - if: matrix.lane == 'floor'
        run: mix test --warnings-as-errors
      - if: matrix.lane == 'mid'
        run: mix test --warnings-as-errors
      - if: matrix.lane == 'floor'
        run: python3 scripts/check_optional_clients.py
      # The latest gate also invokes check_optional_clients.py, including the
      # ash_onetime and ash_hooks floors available on that toolchain.
      - if: matrix.lane == 'latest'
        run: python3 scripts/check.py
      # Log, then remove, on every outcome: the server log carries only fixture values.
      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect "$REQUESTSEAL_TEST_PG_SERVER" > /dev/null 2>&1; then
            docker logs "$REQUESTSEAL_TEST_PG_SERVER"
            docker rm -f -v "$REQUESTSEAL_TEST_PG_SERVER"
          fi
  mutations:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 16 # run 44281082286: cold 7m43s
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Refuse a differing installed runtime
        env:
          ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          OTP: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$ELIXIR" "erlang=$OTP"
      - name: Restore Mix test dependencies and build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: mix-latest-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Require every reversing mutation to turn its named test red
        run: python3 scripts/mutations.py
  release-gate-self-check:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 45224811554: 40s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Refuse a differing installed runtime
        env:
          ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          OTP: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$ELIXIR" "erlang=$OTP"
      - name: Restore benchmark dependencies and builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/release-gate-build/baseline/deps
            ${{ runner.temp }}/release-gate-build/baseline/_build/prod
            ${{ runner.temp }}/release-gate-build/candidate/deps
            ${{ runner.temp }}/release-gate-build/candidate/_build/prod
          key: release-gate-mix-latest-${{ needs.toolchain.outputs.elixir }}-${{ needs.toolchain.outputs.otp }}-prod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('bench/release_gates/*/mix.lock', 'bench/release_gates/*/mix.exs') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Run both versions and validate the retained evidence
        run: |
          python3 scripts/jwe_release_gates.py round --id 1 --self-check --commit "$GITHUB_SHA" \
            --build-directory "$RUNNER_TEMP/release-gate-build" \
            --output "$RUNNER_TEMP/release-gate-self-check/round.json"
          python3 scripts/jwe_release_gates.py collect --self-check --commit "$GITHUB_SHA" \
            --rounds "$RUNNER_TEMP/release-gate-self-check" \
            --output "$RUNNER_TEMP/release-gate-self-check/verdict.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-gate-self-check
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/release-gate-self-check/
  hex-package:
    env:
      HEX_PUBLISH_MIRROR_SHA: 654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Refuse a differing installed runtime
        env:
          ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          OTP: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$ELIXIR" "erlang=$OTP"
      - name: Install the shared action's Hex version
        working-directory: ${{ runner.temp }}
        run: |
          hex_version="$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/baselabs/.github/$HEX_PUBLISH_MIRROR_SHA/.github/actions/hex-publish/hex-version")"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - run: mix local.rebar --force
      - uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: qualify
          package: request_seal
          package-directory: .
  hex-evidence:
    env:
      HEX_PUBLISH_MIRROR_SHA: 654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
    needs: [toolchain, hex-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Refuse a differing installed runtime
        env:
          ELIXIR: ${{ needs.toolchain.outputs.elixir }}
          OTP: ${{ needs.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$ELIXIR" "erlang=$OTP"
      - name: Install the shared action's Hex version
        working-directory: ${{ runner.temp }}
        run: |
          hex_version="$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            "https://raw.githubusercontent.com/baselabs/.github/$HEX_PUBLISH_MIRROR_SHA/.github/actions/hex-publish/hex-version")"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force
      - run: mix local.rebar --force
      # A separate job reads the archives only after the qualifying job has finalized them.
      - name: Download the exact qualified archives for product checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-hexpm-request_seal
          path: ${{ runner.temp }}/qualified-hex
      - name: Check documentation in the qualified archive
        run: |
          docs="$RUNNER_TEMP/qualified-docs"
          mkdir "$docs"
          tar -xzf "$RUNNER_TEMP/qualified-hex/docs.tar.gz" -C "$docs"
          python3 scripts/check_docs.py --docs-output "$docs"
          python3 -I -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from check import check_doc_links; check_doc_links(Path(sys.argv[1]))' "$docs"
      - name: Verify corpus and generate release evidence
        run: |
          metadata="$(find corpus -name .DS_Store -print)"
          if [ -n "$metadata" ]; then
            echo "Refusing to package corpus containing .DS_Store" >&2
            exit 1
          fi
          python3 scripts/verify_corpus.py
          evidence="$RUNNER_TEMP/request-seal-release-evidence"
          mkdir "$evidence"
          umask 022
          tar -C corpus --format=gnu --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' --exclude=.DS_Store -cf - index.json sources cases | gzip -n > "$evidence/corpus.tar.gz"
          (cd "$evidence" && sha256sum corpus.tar.gz > corpus.sha256)
          python3 scripts/sbom.py --tarball "$RUNNER_TEMP/qualified-hex/package.tar" --output "$evidence/sbom.cdx.json"
      - name: Attest the qualified release archives and product evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/qualified-hex/package.tar
            ${{ runner.temp }}/qualified-hex/docs.tar.gz
            ${{ runner.temp }}/request-seal-release-evidence/corpus.tar.gz
            ${{ runner.temp }}/request-seal-release-evidence/sbom.cdx.json
      - name: Bind the SBOM to the qualified package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/qualified-hex/package.tar
          sbom-path: ${{ runner.temp }}/request-seal-release-evidence/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: request-seal-release-evidence
          path: ${{ runner.temp }}/request-seal-release-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Remove qualification scratch
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qualified-hex" "$RUNNER_TEMP/qualified-docs" "$RUNNER_TEMP/request-seal-release-evidence"
  qualified:
    if: always()
    needs: [process-ownership-macos, toolchain, verify, mutations, release-gate-self-check, hex-package, hex-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44281082286: cold 5s (<2.5m)
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.toolchain.outputs.python }}
      - name: Refuse a differing installed Python
        env:
          EXPECTED_PYTHON: ${{ needs.toolchain.outputs.python }}
        run: scripts/toolchain.sh --installed "python=$EXPECTED_PYTHON"
      - name: Require every proof job in this run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          PROOFS_RESULTS: ${{ toJSON(needs) }}
          VERIFY_MATRIX: ${{ needs.toolchain.outputs.matrix }}
        run: python3 scripts/qualify.py
