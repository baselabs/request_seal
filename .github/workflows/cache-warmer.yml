name: Cache warmer
on:
  push:
    branches: [main]
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cache-warmer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dialyzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet; measure the first cold green build
    steps:
      - name: Refuse any ref except the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        run: python3 scripts/toolchain.py --github-output "$GITHUB_OUTPUT"
      - id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: |
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: dialyzer-plt-${{ steps.pins.outputs.elixir }}-${{ steps.pins.outputs.otp }}-${{ hashFiles('mix.lock') }}
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.pins.outputs.elixir }}
          otp-version: ${{ steps.pins.outputs.otp }}
          version-type: strict
      - name: Build the exact cold PLT
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          EXPECTED_ELIXIR: ${{ steps.pins.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.pins.outputs.otp }}
        run: |
          python3 scripts/toolchain.py --verify-installed
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix dialyzer --plt
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: ${{ steps.lookup.outputs.cache-primary-key }}
